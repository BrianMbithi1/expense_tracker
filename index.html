<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Expense Tracker</h1>
      <label class="home-currency">
        Home currency
        <select id="home-currency"></select>
      </label>
    </header>

    <div id="status" class="status" role="status" aria-live="polite" hidden></div>

    <section class="total" aria-label="Total spending">
      <p class="total-label">Total in <span id="total-currency">USD</span></p>
      <p id="total-amount" class="total-amount">0.00</p>
      <p id="total-note" class="total-note"></p>
    </section>

    <section aria-labelledby="add-title">
      <h2 id="add-title">Add expense</h2>
      <form id="expense-form" class="expense-form">
        <label>Description
          <input id="description" type="text" required maxlength="60" placeholder="Lunch in Nairobi" />
        </label>
        <label>Amount
          <input id="amount" type="number" min="0.01" step="0.01" required placeholder="12.50" />
        </label>
        <label>Currency
          <select id="currency"></select>
        </label>
        <label>Category
          <select id="category"></select>
        </label>
        <button type="submit">Add expense</button>
      </form>
    </section>

    <section aria-labelledby="list-title">
      <div class="list-header">
        <h2 id="list-title">Expenses</h2>
        <label>Show
          <select id="filter"></select>
        </label>
      </div>
      <ul id="expense-list" class="expense-list"></ul>
    </section>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
